version: "3.8"

services:
  mongodb:
    image: mongo:6.0
    container_name: muchtodo-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: much_todo_db
    volumes:
      - mongo_data:/data/db
    networks:
      - muchtodo-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: muchtodo-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      MONGO_URI: mongodb://root:rootpassword@mongodb:27017/much_todo_db?authSource=admin
      DB_NAME: much_todo_db
      JWT_SECRET_KEY: "super-secret-jwt-key-for-muchtodo-app"
      JWT_EXPIRATION_HOURS: 72
      ENABLE_CACHE: "false"
      LOG_LEVEL: "INFO"
      LOG_FORMAT: "json"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - muchtodo-network

volumes:
  mongo_data:

networks:
  muchtodo-network:
    driver: bridge